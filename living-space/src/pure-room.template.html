<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>龙娘的小屋</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font:13px 'Microsoft YaHei UI',sans-serif;color:#435448}#stage{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}#status{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}
#context-menu,#adjust-panel{position:fixed;z-index:10;background:#fffdf6;border:1px solid #cdd5c7;border-radius:12px;padding:7px;box-shadow:0 5px 14px #28352422;max-height:calc(100vh - 16px);overflow:auto}#context-menu{width:202px}nav{display:grid;gap:2px}button{font:inherit;border:0;border-radius:7px;background:transparent;color:inherit;text-align:left;cursor:pointer;padding:7px 10px;width:100%}button:hover,button:focus-visible{background:#e9efdf;outline:none}button[aria-pressed=true]{background:#e5eddf;color:#436849}button:disabled{opacity:.4;cursor:default}hr{border:0;border-top:1px solid #e4e7de;margin:5px 3px}.danger{color:#9a5046}#adjust-panel{width:280px;left:12px;top:12px;padding:12px}#adjust-panel label{display:flex;align-items:center;justify-content:space-between;margin:10px 0}input{width:170px;accent-color:#718c6a}#adjust-close{width:auto;float:right;padding:0 5px}
#furniture-feedback{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);max-width:calc(100% - 24px);padding:9px 13px;border-radius:10px;background:#fffdf6;color:#586a50;font-size:12px;pointer-events:none;white-space:nowrap}
#room-game{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(410px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;padding:18px;background:#fffdf6;border:1px solid #ccd6c7;border-radius:16px;box-shadow:0 8px 24px #26382733;z-index:7}
.game-heading{display:flex;flex-direction:column;gap:4px}.game-heading strong{font-size:17px}.game-heading span,#room-game small{color:#87907e;font-size:11px}.game-stats{margin:12px 0;color:#6b805e;font-size:12px}.game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.game-card{display:grid;place-items:center;height:clamp(48px,10vh,68px);padding:0;border:1px solid #cdd7c4;border-radius:10px;background:#e7eedd;color:#69845b;font-size:26px;transition:background .12s}.game-card:disabled{opacity:1;cursor:default}.game-card[data-matched=true]{background:#f0f3e8;border-color:#b4c49f}.game-message{min-height:32px;font-size:12px;line-height:1.5;margin:12px 0 6px}.game-actions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.game-actions button{width:auto;border:1px solid #d7ddcf;padding:7px 9px;font-size:12px}.game-actions button:last-child{flex:1;text-align:center}#context-menu{z-index:12}
@media(prefers-reduced-motion:reduce){.game-card{transition:none}}
.fish-grid{grid-template-columns:repeat(3,1fr)}.fish-cell{display:grid;place-items:center;height:clamp(54px,11vh,78px);padding:0;border:1px solid #d3dfd2;border-radius:12px;background:#eef2e7;font-size:30px;color:#8b9e86}.fish-cell[data-target=true]{background:#e0efe9;border-color:#97bea9}.fish-cell:disabled{opacity:.65;cursor:default}.game-stats{font-variant-numeric:tabular-nums}.computer-choices{display:grid;gap:8px;margin-top:16px}.computer-choices button{background:#eef2e7;border:1px solid #d6decc;padding:11px 12px}
.snake-board{display:block;width:min(100%,260px,38vh);height:auto;aspect-ratio:1;margin:auto;border-radius:8px;outline-offset:3px;image-rendering:auto}.snake-controls{display:flex;justify-content:center;gap:8px;margin-top:8px}.snake-controls button{min-width:42px;padding:6px}.snake-board:focus-visible{outline:2px solid #69845b}__GAME_STYLES__</style><body><main id="stage"><canvas aria-label="龙娘的三维房间，右键打开功能菜单" tabindex="0"></canvas><div id="status" role="status">正在加载小屋…</div></main>
<div id="context-menu" role="menu" aria-label="小屋功能" hidden><div class="room-menu-title">小屋时光</div><nav><div class="room-menu-caption">龙娘姿态</div>
<button data-pose="back" aria-pressed="true">背身挂机</button><button data-pose="turn" aria-pressed="false">回头看你</button><button data-pose="relax" aria-pressed="false">扶手椅放松</button><button data-pose="rest" aria-pressed="false">闭目休息</button><hr>
<div class="room-menu-caption">小屋生活</div><button id="room-outdoor">出门到小镇</button><button id="room-alarm">专注闹钟</button><button id="room-pat">摸摸头</button><button id="room-life-toggle" disabled>自动生活</button><button id="room-life-hold" disabled>固定当前场景</button><hr>
<div class="room-menu-caption">动画与摆位</div><button id="demo" aria-pressed="true">连贯演示</button><button id="motion" aria-pressed="true">暂停动作</button><button id="soft-light" aria-pressed="false">落地灯</button><button id="companion-hints" aria-pressed="true">陪玩提示</button><button id="zoom" aria-pressed="false">拉近工作位</button><button id="adjust-toggle">微调坐姿</button><button id="reset">恢复摆位</button><hr>
<div class="room-menu-caption">桌面控制</div><button data-native="drag">移动小屋</button><button data-native="close">切换回桌宠界面</button><button data-native="menu">桌宠完整菜单</button><button data-native="quit" class="danger">关闭桌宠</button>
</nav></div>
<section id="adjust-panel" aria-label="微调坐姿" hidden><button id="adjust-close" aria-label="关闭微调">×</button><strong>微调坐姿</strong><label>左右<input name="x" type="range" min="-0.8" max="0.8" step="0.01" value="0"></label><label>前后<input name="z" type="range" min="-0.8" max="0.8" step="0.01" value="0"></label><label>高度<input name="y" type="range" min="-0.3" max="0.5" step="0.01" value="0"></label><label>大小<input name="size" type="range" min="1.1" max="2.3" step="0.01" value="1.7"></label></section>
